<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEB 6/1 | Invitación Especial</title>
  <meta name="description" content="Te invitamos cordialmente a nuestra ceremonia y recepción de graduación del CEB 6/1." />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CEB 6/1 | Invitación Especial" />
  <meta property="og:description" content="Te invitamos cordialmente a nuestra ceremonia y recepción de graduación del CEB 6/1." />
  <meta id="og-image" property="og:image" content="/og-image.jpeg" />
  <meta id="og-image-secure" property="og:image:secure_url" content="/og-image.jpeg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="CEB 6/1 Invitación" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CEB 6/1 | Invitación Especial" />
  <meta name="twitter:description" content="Te invitamos cordialmente a nuestra ceremonia y recepción de graduación del CEB 6/1." />
  <meta id="twitter-image" name="twitter:image" content="/og-image.jpeg" />

  <script>
    (function () {
      try {
        var origin = window.location.origin;
        if (origin && origin !== 'null' && !origin.includes('localhost')) {
          var imageUrl = origin + '/og-image.jpeg?v=1';
          var ogImg = document.getElementById('og-image');
          var ogImgSec = document.getElementById('og-image-secure');
          var twImg = document.getElementById('twitter-image');
          if (ogImg) ogImg.setAttribute('content', imageUrl);
          if (ogImgSec) ogImgSec.setAttribute('content', imageUrl);
          if (twImg) twImg.setAttribute('content', imageUrl);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display+SC:wght@400;700&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
